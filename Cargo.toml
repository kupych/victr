[workspace]
resolver = "2"
members = [
    "crates/victr-core",
    "crates/victr-desktop",
    "crates/victr-web",
]
default-members = ["crates/victr-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
